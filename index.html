            ]},
            { id: 'budget', title: '您的購機預算？', description: '我們會根據 2026 市場行情為您過濾。', options: [
                { value: 'all', label: '不限預算', icon: 'M13 10V3L4 14h7v7l9-11h-7z' },

        window.render = function() {
            const pageY = window.pageYOffset || document.documentElement.scrollTop;
            const adminListEl = document.getElementById('admin-list');
            const adminScrollY = adminListEl ? adminListEl.scrollTop : 0;

            const root = document.getElementById('app');
            root.innerHTML = '';

            if (state.isAdmin) {
                renderAdmin(root);
                const newAdminList = document.getElementById('admin-list');
                if (newAdminList) newAdminList.scrollTop = adminScrollY;
            } else {
                renderUserUI(root);
            }

            window.scrollTo(0, pageY);
        };

        function renderUserUI(root) {
            const header = document.createElement('header');
            header.className = 'w-full mb-10 flex flex-col items-center gap-4 relative';

                    </button>
                </div>
                <div class="text-center">
                    <h1 class="text-4xl md:text-5xl font-black text-blue-600 mb-2 flex items-center justify-center gap-3 tracking-tighter">
                        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg> 智慧手機挑選助手

                    <p class="text-slate-400 font-bold text-sm tracking-widest uppercase">Comprehensive 2026 Collection</p>
                </div>
            `;
            root.appendChild(header);

            const main = document.createElement('main');
            main.className = 'bg-white w-full rounded-[48px] shadow-2xl border border-slate-100 overflow-hidden min-h-[580px] flex flex-col fade-in';
            
            if (!state.isFinished) {
                const step = STEPS[state.currentStep];
                main.innerHTML = `
                    <div class="p-8 md:p-12 flex-1 flex flex-col">
                        <div class="flex justify-between items-center mb-12">
                            <div class="flex gap-2">
                                ${STEPS.map((_, i) => `<div class="h-1.5 w-12 rounded-full transition-all duration-500 ${i <= state.currentStep ? 'bg-blue-600' : 'bg-slate-100'}"></div>`).join('')}

                            <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest">STEP ${state.currentStep + 1}/4</span>
                        </div>
                        <div class="mb-12 text-center md:text-left">

                            <p class="text-slate-400 text-sm font-medium leading-relaxed">${step.description || ''}</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1">
                            ${step.options.map(opt => `
                                <button type="button" onclick="selectOption('${step.id}', '${opt.value}')" class="p-7 text-left rounded-[32px] border-2 transition-all group flex items-center gap-6 border-slate-50 hover:border-blue-500 hover:bg-blue-50/30 active:scale-95 shadow-sm">

                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <div class="font-black text-xl leading-tight mb-1 text-slate-700 break-words whitespace-normal">${opt.label}</div>
                                    </div>
                                </button>
                            `).join('')}
                        </div>
                        <div class="mt-8 pt-8 border-t border-slate-50">
                            <button type="button" onclick="goBack()" ${state.currentStep === 0 ? 'disabled' : ''} class="flex items-center gap-2 px-6 py-2.5 rounded-[20px] text-xs font-black transition-all ${state.currentStep === 0 ? 'text-slate-100' : 'text-slate-400 hover:text-blue-600 hover:bg-blue-50'}">
                                ← 上一步
                            </button>
                        </div>
                    </div>
                `;
            } else {
                renderResults(main);
            }
            root.appendChild(main);

            if (state.showInventory) renderInventoryModal(root);
        }

        function renderResults(container) {
            const filtered = phones.filter(p => {
                if (!p.isVisible) return false;
                if (state.selections.condition && p.condition !== state.selections.condition) return false;
                if (state.selections.budget === 'high' && p.price < 30000) return false;
                if (state.selections.budget === 'mid' && (p.price < 15000 || p.price >= 30000)) return false;
                if (state.selections.budget === 'budget' && p.price >= 15000) return false;
                if (state.selections.os !== 'no-pref' && p.os !== state.selections.os) return false;
                return true;
            }).sort((a, b) => {
                const aScore = a.strengths.includes(state.selections.priority) ? 1 : 0;
                const bScore = b.strengths.includes(state.selections.priority) ? 1 : 0;
                return bScore - aScore;
            });

            container.innerHTML = `
                <div class="p-8 md:p-12 flex-1 flex flex-col">
                    <div class="flex items-center justify-between mb-10 pb-6 border-b border-slate-50 gap-4">
                        <div class="flex-1 min-w-0">
                            <h2 class="text-3xl font-black text-slate-800 tracking-tight">推薦結果</h2>
                            <p class="text-slate-400 text-[11px] font-black mt-1 uppercase tracking-[0.2em]">根據庫存順序與需求即時匹配</p>
                        </div>
                        <button type="button" onclick="resetApp()" class="p-4 text-slate-200 hover:text-blue-600 hover:bg-blue-50 rounded-full transition-all shadow-sm shrink-0">
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                    </div>
                    <div class="grid grid-cols-1 gap-6 max-h-[500px] overflow-y-auto pr-3 custom-scrollbar flex-1">
                        ${filtered.length > 0 ? filtered.map((p, i) => `
                            <div class="p-8 border-2 rounded-[40px] transition-all hover:shadow-2xl ${i === 0 ? 'border-blue-600 ring-8 ring-blue-50 bg-white shadow-xl' : 'border-slate-50 bg-white'}">
                                <div class="flex flex-col md:flex-row gap-8">

        // 行政邏輯
        window.enterAdmin = function() { state.isAdmin = true; state.showInventory = false; window.render(); };
        window.exitAdmin = function() { state.isAdmin = false; window.render(); };
        window.setEditing = function(id) { state.editingId = id; window.render(); };
        window.toggleInventory = function(show) { state.showInventory = show; window.render(); };
        
        window.saveEdit = function(id) {
            const p = phones.find(x => x.id === id);
            if (!p) return;
            p.name = document.getElementById(`edit-name-${id}`).value;
            p.brand = document.getElementById(`edit-brand-${id}`).value;
            p.condition = document.getElementById(`edit-cond-${id}`).value;
            p.price = parseInt(document.getElementById(`edit-price-${id}`).value) || 0;
            p.description = document.getElementById(`edit-desc-${id}`).value;
            state.editingId = null;
            saveToLocal();
            window.render();
        };

        window.togglePhoneVisibility = function(id) {
            const p = phones.find(x => x.id === id);
            if (p) p.isVisible = !p.isVisible;
            saveToLocal();
            window.render();
        };

        window.deletePhone = function(id) {
            phones = phones.filter(p => p.id !== id);
            saveToLocal();
            window.render();
        };

        window.selectOption = function(stepId, value) {
            state.selections[stepId] = value;
            if (state.currentStep < STEPS.length - 1) {
                state.currentStep++;
            } else {
                state.isFinished = true;
            }
            window.render();
        };

        window.goBack = function() {
            if (state.currentStep > 0) {
                state.currentStep--;
                window.render();
            }
        };

        window.addNewPhone = function() {
            const name = document.getElementById('new-name').value;
            const price = parseInt(document.getElementById('new-price').value);
            if (!name || isNaN(price)) return;
            phones.unshift({
                id: Date.now(),
                name,
                brand: document.getElementById('new-brand').value,
                os: document.getElementById('new-brand').value === 'Apple' ? 'iOS' : 'Android',
                price,
                condition: document.getElementById('new-condition').value,
                description: document.getElementById('new-desc').value || '新加入機型',
                isVisible: true,
                strengths: ['value'],
                specs: { display: '6.7 吋', camera: '48MP', battery: '5000mAh' }
            });
            saveToLocal();
            window.render();
        };

        window.resetApp = function() {
            state.currentStep = 0;
            state.isFinished = false;
            state.selections = { condition: '', budget: '', os: '', priority: '' };
            window.render();
        };

        // 匯出/匯入邏輯
        window.exportData = function() {
            const dataStr = JSON.stringify(phones);
            const encoded = btoa(encodeURIComponent(dataStr));
            // 嘗試複製到剪貼簿
            const tempInput = document.createElement("input");
            document.body.appendChild(tempInput);
            tempInput.value = encoded;
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            alert("設定代碼已複製！將這段代碼傳給朋友，讓他在匯入處貼上即可。");
        };

        window.importDataPrompt = function() {
            const input = prompt("請貼上匯入代碼：");
            if (!input) return;
            try {
                const decoded = decodeURIComponent(atob(input));
                const parsed = JSON.parse(decoded);
                if (Array.isArray(parsed)) {
                    phones = parsed;
                    saveToLocal();
                    window.render();
                    alert("匯入成功！設定已更新。");
                }
            } catch (e) {
                alert("代碼錯誤，請確保代碼完整。");
            }
        };

        function initDragAndDrop() {
            const list = document.getElementById('admin-list');
            if (!list) return;
            const items = list.querySelectorAll('[draggable="true"]');
            
            items.forEach(item => {
                item.addEventListener('dragstart', (e) => {
                    state.draggedIndex = parseInt(item.getAttribute('data-index'));
                    item.classList.add('dragging');
                });
                item.addEventListener('dragend', () => item.classList.remove('dragging'));
                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    const afterElement = getDragAfterElement(list, e.clientY);
                    const draggingItem = document.querySelector('.dragging');
                    if (draggingItem) {
                        if (afterElement == null) list.appendChild(draggingItem);
                        else list.insertBefore(draggingItem, afterElement);
                    }
                });
                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const newOrder = Array.from(list.children).map(el => {
                        const idx = parseInt(el.getAttribute('data-index'));
                        return phones[idx];
                    });
                    phones = newOrder;
                    saveToLocal();
                    window.render();
                });
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('[draggable="true"]:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        window.onload = window.render;
    </script>
</body>
